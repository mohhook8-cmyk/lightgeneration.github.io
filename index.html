<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUNAR WIRELESS POWER</title>
<style>body{background:#020617;color:white;font-family:Arial;text-align:center;padding:20px}
#big{font-size:90px;font-weight:bold;color:#38f8ff;text-shadow:0 0 20px #38f8ff}
.live{background:#22c55e;padding:5px 15px;border-radius:20px}
#ago{opacity:.7;font-size:13px;margin-top:8px}
</style></head><body>
<div>🌑 LUNAR WIRELESS POWER</div>
<div style="font-size:40px">🌙 〰📡〰 🌍</div>
<div><span class="live">● LIVE FROM THINGSPEAK</span></div>
<div id="big">--.-- V</div>
<div>ELECTRICITY TRANSFERRED TO EARTH BY MICROWAVE</div>
<div id="ago">connecting...</div>
<div id="pwr" style="margin-top:10px;opacity:.8"></div>
<script>
const READ_KEY = "SO6DS5R2K4B4PXSV";
const CH = "3579832";
async function update(){
  try{
    const r = await fetch(`https://api.thingspeak.com/channels/${CH}/feeds/last.json?api_key=${READ_KEY}`);
    const j = await r.json();
    const v = parseFloat(j.field1);
    const p = parseFloat(j.field2);
    document.getElementById('big').innerText = v.toFixed(2) + ' V';
    document.getElementById('pwr').innerText = 'Power: ' + p.toFixed(2) + ' mW';
    // Show how old the data is
    const age = Math.round((Date.now() - new Date(j.created_at).getTime())/1000);
    document.getElementById('ago').innerText = 'Updated ' + age + 's ago • ThingSpeak updates every 15s max';
  }catch(e){ document.getElementById('ago').innerText = 'Retrying...'; }
}
update();
setInterval(update, 5000); // FIXED: was slow, now every 5s
</script></body></html>
